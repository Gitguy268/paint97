name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-visual-baselines:
        description: Regenerate and commit the Linux visual baselines
        type: boolean
        default: false

# Least privilege: read-only everywhere except the visual-baselines job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit, build, budget, CSP sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run check:budget
      - run: npm run check:csp
      - run: npm run check:assets

  e2e:
    name: Playwright (flow, offline, Clippy cadence, axe, visual)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Screenshot baselines are OS-specific. Until the Linux set exists (the job below
      # writes it), screenshots are taken but not compared; everything else still runs.
      - name: Run the suite
        run: |
          if [ -z "$(ls tests/e2e/visual.spec.ts-snapshots/*-linux.png 2>/dev/null)" ]; then
            npx playwright test --ignore-snapshots
          else
            npx playwright test
          fi
      - name: Upload traces and diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore

  visual-baselines:
    name: Write Linux visual baselines
    # The workflow's only write access. Never runs for pull requests: only on main,
    # when no baselines exist yet or a maintainer asks for a refresh.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: need
        run: |
          if [ "${{ inputs.update-visual-baselines }}" = "true" ] || [ -z "$(ls tests/e2e/visual.spec.ts-snapshots/*-linux.png 2>/dev/null)" ]; then
            echo "write=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.need.outputs.write == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.need.outputs.write == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/visual.spec.ts --update-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual.spec.ts-snapshots
          git diff --cached --quiet || git commit -m "test: update Linux visual baselines [skip ci]"
          git push
