name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-visual-baselines:
        description: Regenerate and commit the Linux visual baselines
        type: boolean
        default: false

# Least privilege: only the baseline-bootstrap step below ever writes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit, build, budget, CSP sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run check:budget
      - run: npm run check:csp
      - run: npm run check:assets
      - run: npm run model:verify

  e2e:
    name: Playwright (flow, offline, Clippy cadence, axe, visual)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Screenshot baselines are OS-specific (font rasterisation), so Linux owns its own set:
      # the first run with none, or an explicit dispatch, writes them; every other run compares.
      - name: Decide visual mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.update-visual-baselines }}" = "true" ]; then
            echo "flags=--update-snapshots" >> "$GITHUB_OUTPUT"
          elif [ -z "$(ls tests/e2e/visual.spec.ts-snapshots/*-linux.png 2>/dev/null)" ]; then
            echo "flags=--update-snapshots" >> "$GITHUB_OUTPUT"
          fi
      - run: npx playwright test ${{ steps.mode.outputs.flags }}
      - name: Commit Linux baselines
        if: steps.mode.outputs.flags != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual.spec.ts-snapshots
          git diff --cached --quiet || git commit -m "test: update Linux visual baselines [skip ci]"
          git push
      - name: Upload traces and diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
